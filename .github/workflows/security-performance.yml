name: Performance e Segurança

# Somente agendado ou manual: nada aqui roda em push/PR. Sem teste de carga e sem scan ativo
# (o saucedemo é um site de terceiros; apenas medições de baixo volume e verificações passivas).
on:
  schedule:
    - cron: "0 13 * * 1" # segunda-feira, 10:00 BRT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    name: Performance (@performance, chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Executar @performance
        uses: cypress-io/github-action@v7
        with:
          browser: chrome
          expose: tags=@performance
      - name: Publicar allure-results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-performance
          path: allure-results
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Lighthouse (3 execuções na página de login)
        uses: treosh/lighthouse-ci-action@12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          artifactName: lighthouse-report
          temporaryPublicStorage: false

  security:
    name: Segurança passiva (@seguranca, chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Executar @seguranca
        uses: cypress-io/github-action@v7
        with:
          browser: chrome
          expose: tags=@seguranca
      - name: Publicar allure-results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-security
          path: allure-results
          if-no-files-found: ignore

  zap-baseline:
    name: OWASP ZAP Baseline (passivo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Baseline = spider de 1 minuto + regras passivas. Nenhuma regra ativa (sem ataques).
      - name: ZAP Baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: https://www.saucedemo.com/
          rules_file_name: zap/rules.tsv
          cmd_options: -m 1
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-report
